# cargo-mutants configuration for reconcile-rs.
#
# Verified against this workspace: `cargo mutants --list --workspace --all-features` yields 1511
# mutants with this config (1540 without the exclusions below) -- the delta between them (currently
# 29) is what proves the exclusions still do what the comments below claim. The baseline itself
# moves with every commit that adds or removes mutable code; `scripts/check-mutant-count.sh` (wired
# into `repo-gates` in main.yml) re-measures both numbers on every push instead of asking a human to
# notice and update them by hand (AGENTS.md §10) -- if it fails, update the two numbers above to
# match its output.
#
# Two settings are NOT optional here:
#
#   all_features   — cargo-mutants builds per package. `--features internal-testing`
#                    fails outright because lww-register/rsos/gossip do not define
#                    that feature:
#                      error: the package 'lww-register' does not contain this feature
#
#   test_workspace — by default each mutant only runs its own package's tests.
#                    rsos/, gossip/ and lww-register/ have no tests/ directory; their
#                    real oracles are tests/proptest_fingerprint_tree_map.rs and
#                    tests/service/ in the root package. Without this, the score is
#                    measured against the wrong suite and flatters those crates.

all_features   = true
test_workspace = true

# netem/service tests wait on real sockets; a mutant that breaks convergence can
# hang rather than fail. Timeouts count as caught.
timeout_multiplier   = 3.0
minimum_test_timeout = 60

# Reuse the built target dir in each scratch copy instead of a cold build per mutant.
copy_target = true

exclude_globs = ["benches/**", "examples/**"]

# `testing::` accessors exist only under the internal-testing feature: they are test
# seams, not behaviour. Mutating them yields MISSED results that are noise, not gaps.
#
# `aggregate::aux`'s two fence checks (`key < lower_bound`, `key > upper_bound`) decide whether
# a subtree's cached Aggregate can answer a query without walking it. Their exact comparison
# operator is provably unobservable: `lower_bound`/`upper_bound`, whenever `Some`, can only ever
# have been set from a key the *same* range already classified `RangeOrdering::Inside` one level
# up, so the fast path can only ever wrongly fire when the *other* bound's (correctly-computed)
# check is already false, and the `&&` above never lets that combination through. Verified
# empirically, not just by proof: instrumented every recursive decision across two independent
# property tests (dense and gapped key sets, 20000+ fast-path-eligible calls total) and found
# zero cases where a flipped/loosened/tightened operator changed which subtree got returned.
# #427.
#
# The six patterns below each mutate a loop counter that starts at 0 (`i += 1` -> `i *= 1`, or
# the `<=`/`+` a length-bounded index/count comparison is built from) into an update that never
# advances it -- a genuine infinite loop, not a coverage gap: check-mutation-gate.sh already scores
# a TIMEOUT the same as caught (matching the "hang rather than fail" policy above), so cargo-mutants
# spending its full 300s proving what's true by construction is pure wall-clock cost for the same
# verdict it would reach in 0s if it never generated the mutant at all. #427/#452 measured this
# directly: these six alone cost 6*300s = 30 of a ~120-min in-diff run on a large file-move split.
#
# `replay/bitmap.rs:75:32` (`SlidingBitmap::advance`'s cross-word-boundary shift, `self.0[i] = lo |
# hi`): `lo = old[i-word_shift] << bit_shift` occupies exactly bit positions `[bit_shift, 63]`
# (shifting left drops any overflow past bit 63); `hi = old[i-word_shift-1] >> (64-bit_shift)`
# occupies exactly `[0, bit_shift-1]` (shifting right by `64-bit_shift` zero-fills everything
# above). For every `bit_shift` this branch runs with (it's only entered when `bit_shift != 0`,
# so `1..=63`), those two ranges partition all 64 bit positions with zero overlap -- by
# construction of the shift amounts, not by anything about `old`'s contents. `lo & hi` is
# therefore always `0` for *any* input, which makes `lo | hi` and `lo ^ hi` produce identical
# output always: replacing `|` with `^` here is a genuine equivalent mutant, unlike `|` with `&`
# at the same site (which zeroes the disjoint-bit invariant's whole point and is correctly
# caught). #427.
#
# `range.rs:28:56` is the same defect shape via *recursion* instead of a `while` loop:
# `<ItemRange as Iterator>::next` freezes `children_passed` at its current value (`x * 1 == x`)
# and falls through to `self.next()`, which never converges -- but because that's a genuine
# recursive call rather than a bounded loop, cargo-mutants' own graceful timeout doesn't reliably
# get a chance to fire first: #452 reproduced this locally with the exact CI invocation and got
# `Signalled(9)` at 131s (an external kill, well under the 300s --timeout), not a clean Timeout
# verdict. On a resource-constrained hosted runner the same spike plausibly takes down the whole
# VM rather than just the subprocess -- matching three consecutive "runner has received a shutdown
# signal" failures of `pr-diff`'s shard 0, each stopped at nearly this same mutant.
exclude_re = [
    "testing::",
    "impl Debug",
    "impl Display",
    # `HmacSha256Mac` (`gossip/src/auth/mac.rs`) is `#[cfg(all(feature = "mac-hmac", not(feature =
    # "mac-blake3")))]` — with `all_features = true` above, this gate always builds and tests with
    # both MAC features on, so `not(feature = "mac-blake3")` is false and the entire impl is
    # compiled out: it is not merely untested, it is *absent from the binary*, so no mutation to it
    # can ever change test behaviour under this gate's own build config. Pre-existing on `main`
    # (unchanged since before #427's `gossip/src/auth.rs` split): the split just made these lines
    # newly show up in `git diff` as "added" (a pure code move, scored the same as new code) and
    # surfaced a gap the gate was already structurally incapable of closing. Exercising this backend
    # for real needs `--no-default-features --features mac-hmac`, which this gate does not run.
    "impl Mac for HmacSha256Mac",
    "fingerprint_tree_map/query\\.rs:(36|46):29:",
    "fingerprint_tree_map/query\\.rs:59:19: replace \\+= with \\*=",
    "fingerprint_tree_map/query\\.rs:68:19: replace \\+= with \\*=",
    "fingerprint_tree_map/query\\.rs:100:38: replace \\+ with \\*",
    "fingerprint_tree_map/range\\.rs:28:56: replace \\+ with \\*",
    "fingerprint_tree_map/range\\.rs:59:32: replace <= with >",
    "fingerprint_tree_map/range\\.rs:60:51: replace \\+ with \\*",
    "replay/bitmap\\.rs:75:32: replace \\| with \\^",
]

skip_calls = ["with_capacity", "reserve"]
