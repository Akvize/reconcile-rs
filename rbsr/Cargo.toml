[package]
name = "rbsr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Range-Based Set Reconciliation (Meyer, arXiv:2212.13567) over any RSOS backend"
repository = "https://github.com/Akvize/reconcile-rs"
readme = "README.md"
keywords = ["rbsr", "reconciliation", "anti-entropy", "set", "gossip"]
categories = ["algorithms", "network-programming"]

[dependencies]
# `serde` is load-bearing: `RangeAggregate` and its bound types are wire messages, exchanged
# verbatim between peers. `tracing` carries the one `debug!` on the malformed-segment drop path.
# `rsos` supplies `Aggregate` and the `Rsos` trait the blanket `RsosView` impl is written over —
# the dependency edge points `rbsr` → `rsos` only, never the reverse.
#
# The `version` alongside `path` is what makes this crate publishable: cargo strips `path` at
# publish time and resolves the requirement from crates.io (#204, AGENTS.md §11).
rsos = { version = "0.4.0", path = "../rsos" }
serde = { version = "1.0.192", features = ["derive"] }
tracing = "0.1.40"

[dev-dependencies]
# `tests/pure_deletion_is_never_falsely_skipped.rs` seeds `TRIALS` independent pure-deletion
# instances from a recorded counter (`StdRng::seed_from_u64(trial)`), not the process RNG — see
# that module's docs.
rand = "0.8.5"
# `tests/shipped_policies_always_progress.rs` pins `RefinementPolicy`'s progress law (#420) over
# arbitrary `Comparison`s, the same crate the workspace root already uses for
# `tests/proptest_fingerprint_tree_map/`.
proptest = "1.11.0"

# #330: `RangeAggregate::for_testing` — the seam `reconcile`'s `tests/wire_format.rs` golden vector
# is built through — used to be a normal Cargo feature of this name, reachable by any dependent's
# `Cargo.toml`. Reached now only via `--cfg reconcile_internal_testing` (AGENTS.md §6), which a
# dependent's build cannot set; `check-cfg` below stops that `#[cfg(...)]` from tripping
# `unexpected_cfgs` under `-Dwarnings`. This is what keeps `rbsr` free of a codec dependency: the
# crate owns no encoding, so the byte-level test lives where the codec is actually chosen (the
# adapter layer) rather than here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reconcile_internal_testing)"] }
