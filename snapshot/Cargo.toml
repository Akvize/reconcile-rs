[package]
name = "snapshot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "FileSnapshot: a durable, atomically-replaced file backend for the lww-register Persistence port"
repository = "https://github.com/Akvize/reconcile-rs"
publish = false

[dependencies]
# The on-disk body format. Not self-describing, which is exactly why the file carries a magic +
# version header ahead of it — see `SNAPSHOT_MAGIC` in `src/lib.rs`.
bincode = "1.3.3"
# The port this crate implements (`Persistence`) and the value type it writes (`PersistedState`,
# built from `Entry<Timestamp, V>`). The edge points `snapshot` → `lww-register` only.
lww-register = { path = "../lww-register" }
serde = { version = "1.0.192", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
