name: main

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Enable caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Format
      run: cargo fmt --check
    - name: Doc budget (AGENTS.md + CLAUDE.md line cap)
      run: ./scripts/check-doc-budget.sh
    - name: Domain purity (hexagonal architecture boundary)
      run: ./scripts/check-domain-purity.sh
    # `--features internal-testing` exposes the `reconcile::testing` seam so the external
    # integration-test oracles (`tests/diff.rs`, `tests/proptest_fingerprint_tree_map.rs`) and the benchmark,
    # which reach now-`pub(crate)` reconciliation internals, still compile and run. The
    # `--all-features` steps already cover it; the default steps make it explicit so the oracle
    # always runs.
    - name: Lint
      run: cargo clippy --workspace --features internal-testing --all-targets
    - name: Lint (all features)
      run: cargo clippy --workspace --all-features --all-targets
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --features internal-testing --verbose
    - name: Run tests (all features)
      run: cargo test --workspace --all-features --verbose
    - name: Run doc-tests
      run: cargo test --doc --workspace --features internal-testing --verbose
    - name: Check that the benchmarks can still compile
      run: cargo bench --no-run --features internal-testing
    - name: Generate the documentation
      run: cargo doc --workspace --verbose
    - name: Generate the documentation (all features)
      run: cargo doc --workspace --all-features --verbose
    # Packaging check for the whole workspace — all five members, the release path end to end
    # (#204, AGENTS.md §11). `--workspace` is what makes that possible: cargo strips `path` at
    # publish time and resolves each intra-workspace dependency from crates.io, so a *per-crate*
    # `cargo package -p rbsr` still fails with "no matching package named `rsos`" until `rsos` is
    # actually published — only `rsos`, `lww-register` and `reconcile-gossip` (the members with no
    # intra-workspace dependency) can be checked one at a time today. `--workspace` packages them
    # together and resolves the `path` + `version` pairs against a local temporary registry
    # instead, which covers `rbsr` and `reconcile` too. Keep it as one invocation for that reason;
    # splitting it back into per-crate steps silently drops two crates from the check.
    #
    # `cargo package` (not `publish --dry-run`): it packages *and* compiles the packaged crate,
    # which is the breakage this check exists to catch, without contacting the registry to upload.
    - name: Check that the whole workspace packages cleanly
      run: cargo package --workspace --allow-dirty

  # #203: the default feature set and `--all-features` both resolve to `mac-blake3` (it takes
  # precedence when both MAC backends are enabled, per Cargo.toml), so `mac-hmac` — a published,
  # user-selectable crypto backend — was compiled by no CI job at all. This is the one job that
  # selects it explicitly.
  mac-hmac:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Enable caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Lint (mac-hmac)
      run: cargo clippy --workspace --no-default-features --features mac-hmac,internal-testing --all-targets
    - name: Build (mac-hmac)
      run: cargo build --workspace --no-default-features --features mac-hmac --verbose
    - name: Run tests (mac-hmac)
      run: cargo test --workspace --no-default-features --features mac-hmac,internal-testing --verbose

  # #203/#230/#283/#309/#312 were all closed by hand citing commits that, at the time, only
  # existed on the PR branch meant to close them -- the PR hadn't merged yet. Nothing forced the
  # PR description to say which issues it closes, so nothing caught the mismatch. This job:
  # every *open* issue mentioned bare in this PR's own body must state its intent, either
  # `Closes #N` (closes it at merge time, via GitHub's own keyword parsing) or an explicit
  # non-closing lead-in (`relates to #N`, `see #N`, ...). See `scripts/check-pr-closes-issues.sh`.
  #
  # `pull_request` only: `github.event.pull_request` is unset on `push`/`merge_group`, and this
  # check is about a PR description, which only exists in that event.
  pr-issue-references:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
    - uses: actions/checkout@v3
    - name: Every open issue mentioned in this PR's body must state its intent
      env:
        GH_TOKEN: ${{ github.token }}
        # An env var, not `${{ github.event.pull_request.body }}` interpolated straight into
        # `run:` -- the latter is a known script-injection vector (a PR body is attacker-controlled
        # text). The script only ever reads $PR_BODY, never evaluates it.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: ./scripts/check-pr-closes-issues.sh

  # #312: advisories (RustSec), license compliance, and a dependency-source allowlist. Config in
  # `deny.toml`. `checks: advisories` alone would silently skip a license/bans/sources regression;
  # the action's default `all` is deliberate here.
  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install llvm-tools-preview
      run: rustup component add llvm-tools-preview
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Enable caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    # `--all-features`: `internal-testing`-gated seams (e.g. `just_insert`) are what the
    # integration-test oracles build against; without it this job fails to compile.
    - name: Generate code coverage
      run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false
