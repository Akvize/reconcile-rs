name: main

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Enable caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Format
      run: cargo fmt --check
    - name: Domain purity (hexagonal architecture boundary)
      run: ./scripts/check-domain-purity.sh
    # `--features internal-testing` exposes the `reconcile::testing` seam so the external
    # integration-test oracles (`tests/diff.rs`, `tests/proptest_fingerprint_tree_map.rs`) and the benchmark,
    # which reach now-`pub(crate)` reconciliation internals, still compile and run. The
    # `--all-features` steps already cover it; the default steps make it explicit so the oracle
    # always runs.
    - name: Lint
      run: cargo clippy --all --features internal-testing
    - name: Lint (all features)
      run: cargo clippy --all --all-features
    - name: Build
      run: cargo build --all --verbose
    - name: Run tests
      run: cargo test --all --features internal-testing --verbose
    - name: Run tests (all features)
      run: cargo test --all --all-features --verbose
    - name: Run doc-tests
      run: cargo test --doc --all --features internal-testing --verbose
    - name: Check that the benchmarks can still compile
      run: cargo bench --no-run --features internal-testing
    - name: Generate the documentation
      run: cargo doc --all --verbose
    - name: Generate the documentation (all features)
      run: cargo doc --all --all-features --verbose
    # `rsos` only: cargo rejects packaging any crate with a path dependency that carries no
    # version requirement, until that dependency is itself on crates.io. `rsos` is the one true
    # leaf (no intra-workspace deps); `rbsr` depends on it by path and `reconcile` on both, so
    # neither can be checked. Publishing the workspace is a policy question tracked under #204;
    # until it is settled, this keeps real packaging-breakage detection where it still works
    # rather than dropping the check entirely.
    # `cargo package` (not `publish --dry-run`): it packages *and* compiles the packaged crate,
    # which is the breakage this check exists to catch, and unlike `publish --dry-run` it does
    # not additionally demand `package.publish = true` — so `rsos` keeps `publish = false` as a
    # guard against being released before #204 is settled.
    - name: Check that the leaf crates package cleanly
      run: cargo package -p rsos --allow-dirty

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install llvm-tools-preview
      run: rustup component add llvm-tools-preview
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Enable caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Generate code coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false
