name: tags

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  # Runs the instant the tag is pushed, no human involved: everything here is either read-only or
  # a dry-run (`cargo package` compiles the packaged tree but uploads nothing). Splitting this out
  # from `publish` below is what lets the *checks* stay fast-fail-automatic while only the
  # irreversible step (an actual `cargo publish`, which cannot be undone — only yanked) waits on a
  # human. A single `environment:`-gated job would pause here too, since environment protection
  # blocks a job's first step, not a chosen line inside it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versions live in the manifests and are committed, not injected here: the tag must match
      # what `Cargo.toml` already says. The `v*` tag names the `reconcile` release. Per #308
      # (AGENTS.md §11): `rsos`/`lww-register`/`reconcile-gossip` are in `reconcile`'s public API,
      # so their version line moves with it — bump all four together in the PR that cuts the tag.
      # `rbsr` is not re-exported and stays independently versioned at `0.x`, published only when
      # its own version changed (`publish_crate` in the `publish` job skips a version already on
      # crates.io, which is the normal, frequent case for `rbsr` alone once the other three are in
      # lockstep).
      - name: Check the tag matches the reconcile version in Cargo.toml
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF##*/v}"
          manifest_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="reconcile"))')
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag v$tag_version does not match reconcile $manifest_version in Cargo.toml" >&2
            exit 1
          fi

      # #310: a release with no changelog entry ships silently undocumented. `CHANGELOG.md` is
      # Keep-a-Changelog (`## [X.Y.Z] - date`), so the tag's version is a section heading —
      # matched literally, not as a semver range, since a released version is an exact string here.
      - name: Check the tag has a matching CHANGELOG.md section
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF##*/v}"
          if ! grep -qF "## [$tag_version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag_version]' section for tag v$tag_version" >&2
            exit 1
          fi

      # Cheap pre-flight: package (and compile) every member together before touching the registry.
      # `--workspace` resolves the intra-workspace `path` + `version` dependencies against a local
      # temporary registry, so it verifies crates that a per-crate `cargo package` cannot until
      # their dependencies are actually on crates.io. Same check main.yml runs on every PR.
      - name: Verify the whole workspace packages cleanly
        run: cargo package --workspace

  # The one job that touches crates.io. Gated on the `production` GitHub Environment: a repo admin
  # must configure it once (Settings → Environments → New environment named `production` → Required
  # reviewers) for this to actually pause — until then `environment:` is a label with no enforced
  # wait. With it configured, the job stops here and a human has to click Approve in the Actions run
  # before `cargo login`/`cargo publish` execute; `verify` above already ran unattended and would
  # have failed fast on a bad tag, so the human is confirming a build that's already known-good, not
  # re-discovering problems.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    # `contents: write` only for the GitHub Release step at the end — `cargo login`/`cargo publish`
    # authenticate against crates.io with CARGO_REGISTRY_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Login on crates repository
        run: echo ${{ secrets.CARGO_REGISTRY_TOKEN }} | cargo login

      # ---------------------------------------------------------------------------------------
      # PUBLISH ORDER IS A HARD CONSTRAINT — DO NOT REORDER.
      #
      # `cargo publish` strips the `path` from each dependency and resolves it from crates.io, so a
      # crate cannot be published until everything it depends on is *already there and indexed*.
      # The dependency graph forces exactly this order:
      #
      #     rsos  →  rbsr ─┐
      #                    ├→  reconcile
      #     lww-register ──┤
      #     reconcile-gossip ┘
      #
      #   1. rsos               — leaf, no workspace dependencies
      #   2. rbsr               — needs rsos
      #      lww-register       — leaf, no workspace dependencies (independent of rbsr)
      #   3. reconcile-gossip   — leaf, no workspace dependencies; kept ahead of the facade
      #   4. reconcile          — needs all four
      #
      # Note `gossip` publishes as `reconcile-gossip` (the plain name is taken on crates.io); the
      # dependents rename it back with `package = "reconcile-gossip"`, so no Rust source changes.
      #
      # crates.io does not make a freshly published version resolvable the instant the upload
      # returns — it has to land in the sparse index first. `cargo publish` waits for that itself,
      # but the wait is best-effort and cross-crate resolution has been observed to lag it, so
      # `publish_crate` polls the sparse index until the exact version is visible before returning.
      # `--no-verify` is NOT the fix for this and must not be used: it would skip compiling the
      # packaged crate, which is precisely the breakage worth catching at release time.
      # ---------------------------------------------------------------------------------------
      - name: Publish the workspace to crates.io, in dependency order
        run: |
          set -euo pipefail

          # Sparse-index path for a crate name (crates.io's 1/2/3/first2-next2 layout).
          index_url() {
            local name="$1"
            case "${#name}" in
              1) echo "https://index.crates.io/1/$name" ;;
              2) echo "https://index.crates.io/2/$name" ;;
              3) echo "https://index.crates.io/3/${name:0:1}/$name" ;;
              *) echo "https://index.crates.io/${name:0:2}/${name:2:2}/$name" ;;
            esac
          }

          # Is <name> <version> already visible in the sparse index?
          indexed() {
            local name="$1" version="$2"
            curl -sS --fail "$(index_url "$name")" 2>/dev/null | python3 -c \
              "import json,sys; sys.exit(0 if any(json.loads(l).get('vers') == sys.argv[1] for l in sys.stdin if l.strip()) else 1)" \
              "$version"
          }

          # Publish one crate, then block until crates.io can actually resolve it.
          # Idempotent: a version already on the registry is skipped rather than failing the
          # release. That is the normal path for the four sibling crates, whose versions change far
          # less often than `reconcile`'s.
          publish_crate() {
            local name="$1"
            local version
            version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]==sys.argv[1]))' "$name")

            if indexed "$name" "$version"; then
              echo "==> $name $version is already on crates.io — skipping"
              return 0
            fi

            echo "==> publishing $name $version"
            cargo publish -p "$name"

            echo "--> waiting for $name $version to appear in the sparse index"
            for _ in $(seq 1 60); do
              if indexed "$name" "$version"; then
                echo "--> $name $version is indexed"
                return 0
              fi
              sleep 10
            done
            echo "::error::$name $version did not appear in the crates.io index within 10 minutes" >&2
            return 1
          }

          publish_crate rsos
          publish_crate rbsr
          publish_crate lww-register
          publish_crate reconcile-gossip
          publish_crate reconcile

      # #310: reuse the same body the `verify` job already confirmed exists, instead of writing
      # release notes by hand a second time in the GitHub UI — one fact (what changed in this
      # release), one place (CHANGELOG.md) it's written down. Extraction stops at the next `## [`
      # heading, or (for the very first Keep-a-Changelog entry, which has no earlier section) at
      # the `[x.y.z]: https://...` reference-link block Keep a Changelog puts after the last entry.
      - name: Extract this version's CHANGELOG.md section
        id: changelog
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF##*/v}"
          awk -v ver="$tag_version" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9]/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # Trim leading/trailing blank lines so the release body doesn't start/end with empty gaps.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::extracted an empty CHANGELOG.md section for v$tag_version" >&2
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md
