name: issue-integrity

# Runs on a schedule, not per-push: this audits the *existing* state of the issue tracker (every
# closed issue's cited SHAs), not the diff of any one commit, so there is no single push it
# belongs to. `workflow_dispatch` lets it be re-run on demand -- e.g. right after closing a batch
# of issues, instead of waiting for the next scheduled tick.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  closed-issue-shas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: `check-closed-issue-shas.sh` needs every
          # commit reachable, to tell "cited SHA never merged" apart from "cited SHA is just old".
          fetch-depth: 0
      - name: Closed issues must not cite commits that never reached main
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-closed-issue-shas.sh

  # Same subject as the job above -- the tracker's existing state rather than any one diff -- so
  # it belongs on this schedule rather than in a second weekly workflow of its own. It needs no
  # history, hence the default shallow checkout.
  open-issue-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open issues must satisfy .github/labels.tsv's invariants
        env:
          GH_TOKEN: ${{ github.token }}
          # Unset for now: the backlog predates the taxonomy, so a deadline would fail the first
          # run for reasons nobody chose. Set it once the backlog is labelled.
          TRIAGE_SLA_DAYS: ''
        run: ./scripts/check-issue-triage.sh
