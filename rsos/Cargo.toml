[package]
name = "rsos"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
# Unlike `lww-register`/`reconcile-gossip`, this one is a reusable crate in its own right, not
# merely published so `reconcile` can be — ARCHITECTURE.md §2. Its version line moves with
# `reconcile`'s regardless (#308, AGENTS.md §11): it is re-exported wholesale
# (`pub use rsos::{Aggregate, Fingerprint, FingerprintTreeMap, Rsos, …}`).
description = "A Range-Summarizable Order-Statistics Store (RSOS): the Rsos<K> trait and its FingerprintTreeMap<K, V> realization. Re-exported by `reconcile`, whose 1.0 stability line it shares."
repository = "https://github.com/Akvize/reconcile-rs"
readme = "README.md"
keywords = ["rsos", "fingerprint", "btree", "range", "blake3"]
categories = ["data-structures"]

# #330: `rsos::counters` — deterministic, machine-independent counts of the aggregate maintenance
# the RSOS contract mandates, which `benches/contention.rs` pairs with its wall-clock throughput
# (#455, #457) — is a test-only seam, never public API. Like `reconcile`'s `crate::testing` and
# `rbsr`'s `RangeAggregate::for_testing`, it is reached only via `--cfg reconcile_internal_testing`
# (AGENTS.md §6), which a dependent's build cannot set; `check-cfg` below stops that `#[cfg(...)]`
# from tripping `unexpected_cfgs` under `-Dwarnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reconcile_internal_testing)"] }

[dependencies]
arrayvec = "0.7.4"
blake3 = "1.5"
range-cmp = "1"
serde = { version = "1.0.192", features = ["derive"] }
tracing = "0.1.40"

[dev-dependencies]
once_cell = "1.21.3"
rand = "0.8.5"
