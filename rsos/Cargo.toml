[package]
name = "rsos"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Unlike `lww-register`/`reconcile-gossip`, this one is a reusable crate in its own right, not
# merely published so `reconcile` can be — ARCHITECTURE.md §2. Its version line moves with
# `reconcile`'s regardless (#308, AGENTS.md §11): it is re-exported wholesale
# (`pub use rsos::{Aggregate, Fingerprint, FingerprintTreeMap, Rsos, …}`).
description = "A Range-Summarizable Order-Statistics Store (RSOS): the Rsos<K> trait and its FingerprintTreeMap<K, V> realization. Re-exported by `reconcile`, whose 1.0 stability line it shares."
repository = "https://github.com/Akvize/reconcile-rs"
readme = "README.md"
keywords = ["rsos", "fingerprint", "btree", "range", "blake3"]
categories = ["data-structures"]

[dependencies]
arrayvec = "0.7.4"
blake3 = "1.5"
range-cmp = "1"
serde = { version = "1.0.192", features = ["derive"] }
tracing = "0.1.40"

[dev-dependencies]
once_cell = "1.21.3"
rand = "0.8.5"
